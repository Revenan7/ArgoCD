apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argoprometheus-ingress
  namespace: argocd-test
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - argoprom.opg.band
    secretName: prometheus-tls
  rules:
  - host: argoprom.opg.band
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus
            port:
              number: 9090
